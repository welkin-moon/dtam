<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0d10" />
    <title>Among Us · 东滩版</title>
    <script>
        (() => {
            try {
                const saved = localStorage.getItem('au-theme');
                const theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (_) {
                document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
        })();
    </script>
    <link rel="preconnect" href="https://p2p-signal.lunarlab.uk" crossorigin />
    <link rel="preconnect" href="https://voice.lunarlab.uk" crossorigin />
    <link rel="dns-prefetch" href="//p2p-signal.lunarlab.uk" />
    <link rel="dns-prefetch" href="//voice.lunarlab.uk" />
    <link rel="stylesheet" href="/styles.css?v=20260824-direct-m3e1" />
    <link rel="stylesheet" href="/player-shell.css?v=20260824-direct-m3e1" />
</head>
<body>
    <div id="menu">
        <button type="button" class="theme-toggle" id="menuThemeBtn" aria-label="切换主题" title="切换深色/浅色主题">深色</button>
        <main class="menu-content">
            <header class="menu-brand"><h1 class="logo">Among Us <span>东滩版</span></h1><p class="sub">在线对局 · 自动连接</p></header>
            <div class="card">
                <div class="field"><label for="playerNameInput">昵称</label><input type="text" id="playerNameInput" placeholder="输入昵称" maxlength="12" value="玩家" autocomplete="nickname" /></div>
                <div class="profile-picker">
                    <div id="avatarPreview" class="avatar-preview" aria-label="头像预览">头像</div>
                    <div class="profile-picker-actions">
                        <input type="file" id="avatarInput" accept="image/*" hidden />
                        <div><button type="button" class="btn btn-outline profile-btn" id="avatarChooseBtn">上传头像</button><button type="button" class="btn btn-outline profile-btn" id="avatarClearBtn">清除</button></div>
                        <small>系统会自动选择可用的联机和语音线路。</small>
                    </div>
                </div>
                <div class="row-buttons"><button type="button" class="btn btn-primary" id="createRoomBtn">创建房间</button><button type="button" class="btn btn-outline" id="showJoinBtn">加入房间</button></div>
                <div class="field" id="joinSection" style="display:none; margin-top:12px;"><label for="roomIdInput">房间号</label><div class="join-row"><input type="text" id="roomIdInput" placeholder="2 位数字" maxlength="2" inputmode="numeric" pattern="[0-9]{2}" autocomplete="off" /><button type="button" class="btn btn-primary" id="joinRoomBtn">加入</button></div></div>
                <div id="menuStatus" aria-live="polite">输入昵称，然后创建或加入房间</div>
            </div>
        </main>
    </div>
    <div id="game">
        <canvas id="canvas"></canvas>
        <div id="rotateOverlay" role="status"><div class="text">横屏体验更好</div></div>
        <div id="chatStream"><div class="empty-msg">暂无消息</div></div>
        <div id="chatPanel" aria-hidden="true"><div id="chatPanelHeader"><span>聊天</span><button type="button" id="chatPanelClose" aria-label="关闭聊天">×</button></div><div id="chatPanelMessages"></div><div id="chatInputArea"><input type="text" id="chatInput" aria-label="聊天消息" placeholder="消息" maxlength="100" autocomplete="off" /><button type="button" id="chatSend">发送</button></div></div>
        <div id="playerPanel"><div id="playerPanelHeader"><span>在线玩家</span><button type="button" class="close-btn" id="playerPanelClose" aria-label="关闭玩家列表">×</button></div><div id="playerPanelBody"></div></div>
        <div id="leaveNotice"></div>
        <div id="joystick"><div class="knob" id="joystickKnob"></div></div>
        <button type="button" id="interactBtn">互动</button>
        <div id="hud">
            <div class="hud-left"><span class="room-tag">房间</span><button type="button" class="room-id" id="roomIdDisplay" title="复制房间号" aria-label="复制房间号">--</button><span id="connectionStatus" data-state="offline" role="button" tabindex="0" aria-label="网络状态及诊断" title="点击查看网络诊断">离线</span><span id="latencyStatus" data-quality="unknown" role="button" tabindex="0" aria-label="网络延迟及诊断" title="点击查看网络诊断">-- ms</span><button type="button" id="playerCountBtn" aria-label="查看在线玩家" aria-expanded="false"><strong id="playerCountNum">1</strong> / 15</button></div>
            <div class="hud-right"><span class="my-name"><span id="hudMyName">玩家</span></span><button type="button" id="mapBtn" title="任务地图" aria-expanded="false">地图</button><button type="button" id="micBtn" title="语音聊天" data-state="off">麦克风关</button><button type="button" id="chatToggle" aria-label="打开聊天" aria-expanded="false">聊天</button><div id="hudMoreWrap"><button type="button" id="moreBtn" aria-label="更多选项" aria-expanded="false">更多</button><div id="hudMoreMenu" hidden><button type="button" id="settingsBtn">切换主题</button><button type="button" class="btn-leave" id="leaveBtn">退出房间</button></div></div></div>
        </div>
        <div id="gameToast" aria-live="polite"></div>
    </div>
    <!-- build: 20260828-reconnect-voice2 -->
    <script type="module" src="/net-config.js?v=20260824-direct-m3e1"></script>
    <script type="module" src="/signal-budget.js?v=20260828-reconnect1"></script>
    <script type="module" src="/runtime-policy.js?v=20260824-direct-m3e1"></script>
    <script type="module" src="/recovery-fanout.js?v=20260824-direct-m3e1"></script>
    <script type="module" src="/p2p-game-room-patch.js?v=20260824-direct-m3e1"></script>
    <script type="module" src="/p2p-join-guard.js?v=20260824-direct-m3e1"></script>
    <script type="module" src="/hybrid-transport.js?v=20260824-direct-m3e1"></script>
    <script type="module" src="/p2p-resilience.js?v=20260828-reconnect2"></script>
    <script type="module" src="/runtime-guard.js?v=20260828-guard2"></script>
</body>
</html>
