[package]
name = "dtam-edge"
version = "3.0.0"
edition = "2024"
rust-version = "1.97"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
futures-util = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal"] }
tokio-tungstenite = "0.30"
webrtc = "0.20"
