name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-music-manifest.cjs
          node --check game.js
          node --check v3-bootstrap.js
          node --check v3-resilience.js
          node --input-type=module --check < p2p-entry.js
          node --input-type=module --check < p2p-trystero.js
          node --input-type=module --check < p2p-cf-mailbox.js
          node --input-type=module --check < p2p-game-room-patch.js
          cp worker.js /tmp/dtam-worker.mjs
          node --check /tmp/dtam-worker.mjs
          node scripts/test.cjs
      - name: Update stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          rustc --version
          cargo --version
      - name: Verify Rust realtime server
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path server/Cargo.toml -- --check
          cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path server/Cargo.toml --locked
      - name: Verify Rust v3 edge
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path edge/Cargo.toml
          cargo fmt --manifest-path edge/Cargo.toml -- --check
          cargo clippy --manifest-path edge/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path edge/Cargo.toml --locked
      - name: Verify Rust v3 tray source
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path tray/Cargo.toml
          cargo fmt --manifest-path tray/Cargo.toml -- --check
      - name: RustSec audit core
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: server
      - name: RustSec audit v3 edge
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: edge
      - name: RustSec audit v3 tray
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: tray
      - name: Reject legacy build layers
        shell: bash
        run: |
          set -euo pipefail
          test ! -d src
          test ! -d build
          test ! -e gameplay.css
          test ! -e gameplay-2.4.css
          test ! -e gameplay-2.5.css
          test ! -e gameplay-2.6.css
          test ! -e RELEASE-2.6.md

  windows-edge:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Update stable Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Build v3 Edge for Windows x64
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path edge/Cargo.toml
          cargo build --release --manifest-path edge/Cargo.toml --locked
      - name: Upload v3 Edge binary
        uses: actions/upload-artifact@v4
        with:
          name: dtam-edge-v3-windows-x64
          path: edge/target/release/dtam-edge.exe
          if-no-files-found: error

  windows-tray:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Update stable Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustc --version
          cargo --version
      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($path in @(
            'scripts/install-v3.ps1',
            'server/installer/install-server.ps1',
            'server/installer/run-server.ps1',
            'server/installer/uninstall-server.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path: $($_.Message)" }
              exit 1
            }
          }
      - name: Build v3 Tray for Windows x64
        shell: pwsh
        run: |
          cargo generate-lockfile --manifest-path tray/Cargo.toml
          cargo fmt --manifest-path tray/Cargo.toml -- --check
          cargo build --release --manifest-path tray/Cargo.toml --locked
      - name: Upload v3 Tray binary
        uses: actions/upload-artifact@v4
        with:
          name: dtam-tray-v3-windows-x64
          path: tray/target/release/dtam-tray.exe
          if-no-files-found: error