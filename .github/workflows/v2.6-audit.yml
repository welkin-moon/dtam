name: v2.6 audit

on:
  push:
    branches: [main, v2.6-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct base game
        shell: bash
        run: |
          cat src/game.b64.* | base64 --decode | gzip --decompress > game.js
          test -s game.js
          node --check game.js
      - name: Apply gameplay 2.3
        run: node build/patch-game-2.3.cjs
      - name: Apply gameplay 2.4
        run: node build/patch-game-2.4.cjs
      - name: Apply gameplay 2.4 final
        run: node build/patch-game-2.4-final.cjs
      - name: Prepare gameplay 2.5 role block
        run: node build/patch-game-2.5-prep.cjs
      - name: Prepare gameplay 2.5 events
        run: node build/patch-game-2.5-events-prep.cjs
      - name: Apply gameplay 2.5
        run: node build/run-patch-game-2.5.cjs
      - name: Apply gameplay 2.5 final fixes
        run: node build/patch-game-2.5-fix.cjs
      - name: Apply gameplay 2.6
        run: node build/patch-game-2.6.cjs
      - name: Validate gameplay 2.6
        run: |
          node --check game.js
          node build/test-game-2.6.cjs
          wc -c game.js
      - name: Upload reconstructed production source
        uses: actions/upload-artifact@v4
        with:
          name: dtam-v2.6-production
          path: |
            _headers
            game.js
            index.html
            styles.css
            gameplay.css
            gameplay-2.4.css
            gameplay-2.5.css
            gameplay-2.6.css
            RELEASE-2.6.md
            build/*.cjs
          if-no-files-found: error
          retention-days: 7
