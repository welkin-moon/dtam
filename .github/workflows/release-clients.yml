name: Release DTAM bundle

on:
  push:
    branches:
      - 'release-v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#release-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bad release branch: $GITHUB_REF_NAME" >&2
            exit 2
          fi
          git fetch origin main --depth=1
          source_sha="$(git rev-parse origin/main)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  server:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - name: Update stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build Windows x64 authoritative server
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $ErrorActionPreference='Stop'
          cargo build --release --locked --manifest-path server/Cargo.toml
          $src='server/target/release/dtam-server.exe'
          if (-not (Test-Path $src)) { throw 'dtam-server.exe missing' }
          New-Item -ItemType Directory -Force -Path release-server | Out-Null
          Copy-Item $src ("release-server/DTAM-Server-Windows-x64-v{0}.exe" -f $env:VERSION)
      - uses: actions/upload-artifact@v4
        with:
          name: dtam-release-server
          path: release-server/*.exe
          if-no-files-found: error

  release:
    needs: [prepare, server]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: dtam-release-server
          path: .

      - name: Download and verify signed client assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-all-errors 'https://update.lunarlab.uk/latest.json' -o latest.json
          test "$(jq -r '.version' latest.json)" = "$VERSION"

          win_url="$(jq -r '.windows.url' latest.json)"
          win_sha="$(jq -r '.windows.sha256' latest.json)"
          win_size="$(jq -r '.windows.size' latest.json)"
          apk_url="$(jq -r '.android.url' latest.json)"
          apk_sha="$(jq -r '.android.sha256' latest.json)"
          apk_size="$(jq -r '.android.size' latest.json)"
          test "$(jq -r '.android.version' latest.json)" = "$VERSION"
          [[ "$win_url" == https://update.lunarlab.uk/* ]]
          [[ "$apk_url" == https://update.lunarlab.uk/* ]]
          [[ "$win_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$apk_sha" =~ ^[0-9a-f]{64}$ ]]

          win="DTAM-Windows-x64-v${VERSION}.exe"
          apk="DTAM-Android-arm64-v${VERSION}.apk"
          server="DTAM-Server-Windows-x64-v${VERSION}.exe"
          test -f "$server"

          curl -fL --retry 4 --retry-all-errors "$win_url" -o "$win"
          curl -fL --retry 4 --retry-all-errors "$apk_url" -o "$apk"
          test "$(stat -c %s "$win")" = "$win_size"
          test "$(stat -c %s "$apk")" = "$apk_size"
          echo "$win_sha  $win" | sha256sum -c -
          echo "$apk_sha  $apk" | sha256sum -c -

          zip -j "DTAM-Windows-x64-v${VERSION}.zip" "$win" client/windows/README.md
          sha256sum "$win" "$apk" "$server" "DTAM-Windows-x64-v${VERSION}.zip" > SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "release v$VERSION already exists" >&2
            exit 3
          fi
          cat > RELEASE_NOTES.md <<EOF
          DTAM v${VERSION}

          - 正式网页：https://d1.lunarlab.uk/
          - Auto 联机优先独立 Server；Server 不可用时才进入去中心化 P2P fallback。
          - GitHub Release 同时归档 Windows x64 客户端、Android arm64 可安装 APK 与 Windows x64 authoritative Server。
          - Android APK 来自 release update source，必须已经使用既有 release certificate 签名；GitHub Actions 不生成替代签名。
          - 更新源：https://update.lunarlab.uk/latest.json

          SHA-256 见随附 SHA256SUMS.txt。
          EOF
          gh release create "v$VERSION" \
            --target "$SOURCE_SHA" \
            --title "DTAM v$VERSION" \
            --notes-file RELEASE_NOTES.md \
            "DTAM-Windows-x64-v${VERSION}.exe" \
            "DTAM-Windows-x64-v${VERSION}.zip" \
            "DTAM-Android-arm64-v${VERSION}.apk" \
            "DTAM-Server-Windows-x64-v${VERSION}.exe" \
            SHA256SUMS.txt
