# trigger: movement-fix-v1
name: Patch movement reconciliation

on:
  push:
    paths:
      - '.github/workflows/patch-movement.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch game.js
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game.js')
          s = p.read_text(encoding='utf-8')

          def rep(old, new):
              global s
              if old not in s:
                  raise SystemExit('missing patch target:\n' + old[:220])
              s = s.replace(old, new, 1)

          rep("const POS_SEND_INTERVAL = 50;\n", "const POS_SEND_INTERVAL = 50;\nconst REMOTE_SMOOTHING = 16;\n")
          rep("let players = {};\nlet myPos", "let players = {};\nlet remoteVisuals = {};\nlet myPos")

          rep("function handleServerMessage(data) {", """function seedRemoteVisuals(source = players) {
            remoteVisuals = {};
            for (const p of Object.values(source)) {
              if (!p || p.id === myPlayerId || !p.pos) continue;
              remoteVisuals[p.id] = { x:p.pos.x, y:p.pos.y, targetX:p.pos.x, targetY:p.pos.y };
            }
          }
          function retargetRemoteVisuals(next) {
            const keep = new Set();
            for (const p of Object.values(next)) {
              if (!p || p.id === myPlayerId || !p.pos) continue;
              keep.add(p.id);
              const v = remoteVisuals[p.id];
              if (!v) remoteVisuals[p.id] = { x:p.pos.x, y:p.pos.y, targetX:p.pos.x, targetY:p.pos.y };
              else { v.targetX = p.pos.x; v.targetY = p.pos.y; }
            }
            for (const id of Object.keys(remoteVisuals)) if (!keep.has(id)) delete remoteVisuals[id];
          }
          function updateRemoteVisuals(dt) {
            const a = 1 - Math.exp(-REMOTE_SMOOTHING * clamp(dt, 0, 0.05));
            for (const v of Object.values(remoteVisuals)) {
              v.x += (v.targetX - v.x) * a;
              v.y += (v.targetY - v.y) * a;
            }
          }
          function handleServerMessage(data) {""")

          rep("""    if (players[myPlayerId]) {
              myPos = { ...players[myPlayerId].pos };
              myName = players[myPlayerId].name;
            }
            isHost = String(msg.hostId || '') === myPlayerId;""", """    if (players[myPlayerId]) {
              myPos = { ...players[myPlayerId].pos };
              myName = players[myPlayerId].name;
            }
            seedRemoteVisuals(players);
            isHost = String(msg.hostId || '') === myPlayerId;""")

          rep("""  if (msg.t === 'state') {
            const next = normalizePlayers(msg.players);
            if (next[myPlayerId]) {
              const serverPos = next[myPlayerId].pos;
              if (Math.hypot(serverPos.x - myPos.x, serverPos.y - myPos.y) > 1.2) myPos = { ...serverPos };
              next[myPlayerId].pos = { ...myPos };
            }
            players = next;
            isHost = !!players[myPlayerId]?.isHost;
            renderPlayerCount();
            return;
          }
          if (msg.t === 'chat')""", """  if (msg.t === 'state') {
            const next = normalizePlayers(msg.players);
            if (next[myPlayerId]) next[myPlayerId].pos = { ...myPos };
            retargetRemoteVisuals(next);
            players = next;
            isHost = !!players[myPlayerId]?.isHost;
            renderPlayerCount();
            return;
          }
          if (msg.t === 'correct') {
            const x = Number(msg.x), y = Number(msg.y);
            if (Number.isFinite(x) && Number.isFinite(y)) {
              myPos = { x, y };
              if (players[myPlayerId]) players[myPlayerId].pos = { ...myPos };
              posDirty = false;
            }
            return;
          }
          if (msg.t === 'chat')""")

          rep("currentRoom = ''; resumeToken = ''; myPlayerId = ''; players = {}; isHost = false;", "currentRoom = ''; resumeToken = ''; myPlayerId = ''; players = {}; remoteVisuals = {}; isHost = false;")
          rep("const pos = p.id === myPlayerId ? myPos : p.pos;", "const visual = remoteVisuals[p.id];\n    const pos = p.id === myPlayerId ? myPos : (visual ? { x:visual.x, y:visual.y } : p.pos);")
          rep("const dt=(now-lastFrameTime)/1000; lastFrameTime=now; update(dt); draw(); requestAnimationFrame(gameLoop);", "const dt=(now-lastFrameTime)/1000; lastFrameTime=now; update(dt); updateRemoteVisuals(dt); draw(); requestAnimationFrame(gameLoop);")

          p.write_text(s, encoding='utf-8')
          PY
          node --check game.js
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          git commit -m "Fix movement reconciliation jitter"
          git push
