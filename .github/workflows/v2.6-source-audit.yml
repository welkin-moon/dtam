name: v2.6 source audit

on:
  push:
    branches: [v2.6-fix]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct base source
        shell: bash
        run: |
          cat src/game.b64.* | base64 --decode | gzip --decompress > game.js
          node --check game.js
          cp game.js game-base.js
      - name: Build 2.3 stage
        run: |
          node build/patch-game-2.3.cjs
          node --check game.js
          cp game.js game-2.3.js
      - name: Build 2.4 stage
        run: |
          node build/patch-game-2.4.cjs
          node build/patch-game-2.4-final.cjs
          node --check game.js
          cp game.js game-2.4.js
      - name: Build 2.5 stage
        run: |
          node build/patch-game-2.5-prep.cjs
          node build/patch-game-2.5-events-prep.cjs
          node build/run-patch-game-2.5.cjs
          node build/patch-game-2.5-fix.cjs
          node --check game.js
          cp game.js game-2.5.js
      - name: Upload source stages
        uses: actions/upload-artifact@v4
        with:
          name: dtam-source-stages
          path: |
            game-base.js
            game-2.3.js
            game-2.4.js
            game-2.5.js
          if-no-files-found: error
          retention-days: 3
