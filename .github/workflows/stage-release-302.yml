name: Stage DTAM 3.0.2 binaries

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-release-302.yml'

permissions:
  contents: read

jobs:
  windows-client:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows client 3.0.2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish client/windows/DTAM.Client.csproj -c Release -r win-x64 --self-contained true -o dist/windows
          if (-not (Test-Path dist/windows/DTAM.exe)) { throw 'DTAM.exe missing' }
          Copy-Item dist/windows/DTAM.exe dist/DTAM-Windows-x64-v3.0.2.exe
          Get-FileHash -Algorithm SHA256 dist/DTAM-Windows-x64-v3.0.2.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dtam-windows-client-v3.0.2
          path: dist/DTAM-Windows-x64-v3.0.2.exe
          if-no-files-found: error

  windows-server:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Update stable Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build realtime server 2.8.3
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cargo build --release --locked --manifest-path server/Cargo.toml
          if (-not (Test-Path server/target/release/dtam-server.exe)) { throw 'dtam-server.exe missing' }
          Copy-Item server/target/release/dtam-server.exe dist-dtam-server.exe
          Get-FileHash -Algorithm SHA256 dist-dtam-server.exe
      - uses: actions/upload-artifact@v4
        with:
          name: dtam-server-windows-x64-2.8.3
          path: dist-dtam-server.exe
          if-no-files-found: error
