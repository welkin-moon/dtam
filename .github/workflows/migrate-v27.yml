name: v2.7 canonicalize

on:
  push:
    branches: [v2.7-cleanup]
    paths: [.github/workflows/migrate-v27.yml]

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v2.7-cleanup
      - name: Reconstruct v2.6 production source
        shell: bash
        run: |
          set -euo pipefail
          cat src/game.b64.* | base64 --decode | gzip --decompress > game.js
          node build/patch-game-2.3.cjs
          node build/patch-game-2.4.cjs
          node build/patch-game-2.4-final.cjs
          node build/patch-game-2.5-prep.cjs
          node build/patch-game-2.5-events-prep.cjs
          node build/run-patch-game-2.5.cjs
          node build/patch-game-2.5-fix.cjs
          node build/patch-game-2.6.cjs
      - name: Canonicalize v2.7
        run: python3 scripts/migrate-v27.py
      - name: Verify exact production sources
        shell: bash
        run: |
          set -euo pipefail
          node --check game.js
          cp worker.js /tmp/dtam-worker.mjs
          node --check /tmp/dtam-worker.mjs
          echo '563a8e4616519054ae2ff0c0647a095030c1f9d33d4836ebfebf2f5531df7605  game.js' | sha256sum -c -
          echo 'f685315f698ff806bf7d0afe26283030a5f4526822bf14f7e6e669645c80251a  index.html' | sha256sum -c -
          echo '04aafc56cb1070949a7ad5efde2fffc3fe44d02cddf1d95b7158078497d9e89b  styles.css' | sha256sum -c -
          echo '72ca94fe20a082af0c3b1c95200628333bb724f44549feb68cde99100be8e913  _headers' | sha256sum -c -
          node scripts/test.cjs
      - name: Save canonical sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.js index.html styles.css _headers
          git commit -m 'build: materialize canonical v2.7 production sources'
          git push origin HEAD:v2.7-cleanup
